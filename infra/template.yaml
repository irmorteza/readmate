AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: ReadMate backend - Textract OCR behind a Lambda Function URL

Parameters:
  PilotToken:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Shared secret sent by the app in the X-Pilot-Token header.
  FrontendOrigin:
    Type: String
    AllowedPattern: '^https://[^/\s]+$'
    ConstraintDescription: A bare https origin without a trailing slash, e.g. https://main.xxxx.amplifyapp.com
    Description: Origin of the deployed PWA, e.g. https://main.xxxx.amplifyapp.com (no trailing slash).
  AlertEmail:
    Type: String
    Description: Address that receives the budget alerts.
  ExecutionRoleArn:
    Type: String
    Description: Lambda execution role, the OcrExecutionRoleArn output of the readmate-github-oidc stack.
  OcrEngine:
    Type: String
    Default: textract
    AllowedValues: [textract] # "fake" needs test fixtures that are not part of the deployed package

Resources:
  OcrFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-ocr"
      Runtime: python3.13
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 15
      CodeUri: ../backend/src
      Handler: readmate.handler.handler
      # No ReservedConcurrentExecutions: this account's concurrency limit (10) is too low to
      # reserve any. Abuse protection is the token plus the budget alarm below.
      Environment:
        Variables:
          PILOT_TOKEN: !Ref PilotToken
          OCR_ENGINE: !Ref OcrEngine
      LoggingConfig:
        LogGroup: !Ref OcrLogGroup
      # Created by the bootstrap stack (infra/github-oidc.yaml), so CI needs no IAM write access.
      Role: !Ref ExecutionRoleArn
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - !Ref FrontendOrigin
            - http://localhost:5173
          AllowMethods: [POST]
          AllowHeaders: [content-type, x-pilot-token]
          MaxAge: 600

  OcrLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-ocr"
      RetentionInDays: 14

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 5
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

Outputs:
  FunctionUrl:
    Description: Set this as VITE_API_URL when building the frontend.
    Value: !GetAtt OcrFunctionUrl.FunctionUrl
