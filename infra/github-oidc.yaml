AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  ReadMate CI/CD bootstrap - GitHub OIDC provider and the scoped deploy role.
  Deployed once by the owner from the laptop (never by CI), stack name readmate-github-oidc.

Parameters:
  GitHubOwner:
    Type: String
    Description: GitHub user or organization that owns the repository.
  GitHubRepo:
    Type: String
    Default: readmate
  GitHubOwnerId:
    Type: String
    AllowedPattern: '^[0-9]+$'
    ConstraintDescription: Digits only, the numeric id of the GitHub user or organization.
    Description: >-
      Numeric id of GitHubOwner. GitHub puts it into the OIDC subject claim
      (repo:OWNER@OWNER_ID/REPO@REPO_ID:environment:production). Find it with
      `gh api users/OWNER --jq .id` (see docs/deploy.md).
  GitHubRepoId:
    Type: String
    AllowedPattern: '^[0-9]+$'
    ConstraintDescription: Digits only, the numeric id of the GitHub repository.
    Description: >-
      Numeric id of the repository. Find it with `gh api repos/OWNER/REPO --jq .id`
      (see docs/deploy.md).
  AppStackName:
    Type: String
    Default: readmate
    Description: Name of the SAM stack the role may update; all resource patterns derive from it.
  AmplifyAppId:
    Type: String
  AmplifyBranch:
    Type: String
    Default: staging
  SamBucketName:
    Type: String
    Description: The aws-sam-cli-managed-default-samclisourcebucket-... bucket from the SAM stack outputs.
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Description: An account can hold one GitHub provider; use "false" if it already exists.

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  # No ThumbprintList: AWS no longer uses it for GitHub's provider.
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  # The Lambda execution role lives here, not in the app stack: CI therefore needs no IAM write
  # permissions at all (a role CI could create or edit would be an admin-equivalent escalation).
  OcrExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppStackName}-ocr-execution"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: OcrExecutionPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: TextractDetectDocumentText
                Effect: Allow
                Action: textract:DetectDocumentText
                Resource: "*" # Textract has no resource-level permissions
              # aws/ssm-encrypted SecureString: no kms statement needed.
              - Sid: ReadAnthropicApiKey
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AppStackName}/anthropic-api-key"
              - Sid: WordInfoTableReadWrite
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt WordInfoTable.Arn

  # Cache and daily counter of the word-info route. Retained: it outlives stack changes.
  WordInfoTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AppStackName}-word-info"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # Named outside the "${AppStackName}-" prefix on purpose, so no pattern in its own policy can
  # ever cover it.
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-deploy-readmate
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref GitHubOidcProvider
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:environment:production"
      Policies:
        - PolicyName: ReadmateDeploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudFormationOwnStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*"
              - Sid: CloudFormationSamManagedStack
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*"
              - Sid: CloudFormationServerlessTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31"
              - Sid: CloudFormationValidate
                Effect: Allow
                Action: cloudformation:ValidateTemplate
                Resource: "*"
              - Sid: SamBucketObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "arn:aws:s3:::${SamBucketName}/*"
              - Sid: SamBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub "arn:aws:s3:::${SamBucketName}"
              - Sid: LambdaOwnFunctions
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:CreateFunctionUrlConfig
                  - lambda:UpdateFunctionUrlConfig
                  - lambda:GetFunctionUrlConfig
                  - lambda:DeleteFunctionUrlConfig
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:ListTags
                  - lambda:PutFunctionConcurrency
                  - lambda:DeleteFunctionConcurrency
                  - lambda:GetPolicy
                  - lambda:GetRuntimeManagementConfig
                  - lambda:GetFunctionCodeSigningConfig
                  - lambda:GetFunctionRecursionConfig
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AppStackName}-*"
              # The only IAM permission CI has: hand the one execution role to Lambda.
              - Sid: IamPassOcrExecutionRoleOnly
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt OcrExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Sid: LogsOwnLogGroups
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                  - logs:TagLogGroup
                  - logs:ListTagsForResource
                  - logs:ListTagsLogGroup
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppStackName}-*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppStackName}-*:*"
              - Sid: LogsDescribe
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              - Sid: BudgetsOwnBudget
                Effect: Allow
                Action:
                  - budgets:ViewBudget
                  - budgets:ModifyBudget
                Resource: !Sub "arn:aws:budgets::${AWS::AccountId}:budget/${AppStackName}-*"
              - Sid: AmplifyDeployToStagingBranch
                Effect: Allow
                Action:
                  - amplify:CreateDeployment
                  - amplify:StartDeployment
                  - amplify:GetJob
                  - amplify:GetBranch
                Resource:
                  - !Sub "arn:aws:amplify:${AWS::Region}:${AWS::AccountId}:apps/${AmplifyAppId}/branches/${AmplifyBranch}"
                  - !Sub "arn:aws:amplify:${AWS::Region}:${AWS::AccountId}:apps/${AmplifyAppId}/branches/${AmplifyBranch}/jobs/*"

Outputs:
  DeployRoleArn:
    Description: Set as the AWS_DEPLOY_ROLE_ARN variable of the GitHub "production" environment.
    Value: !GetAtt DeployRole.Arn
  OcrExecutionRoleArn:
    Description: Set as the OCR_EXECUTION_ROLE_ARN variable of the "production" environment (and ExecutionRoleArn for manual deploys).
    Value: !GetAtt OcrExecutionRole.Arn
  WordInfoTableName:
    Description: DynamoDB table of the word-info cache and daily counter.
    Value: !Ref WordInfoTable
